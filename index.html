<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Ohid AI - Free Fire UID Checker</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:#050505;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:-50%;
    background:conic-gradient(
        #ff0000,
        #ff00ff,
        #0000ff,
        #00ffff,
        #00ff00,
        #ffff00,
        #ff0000
    );
    animation:rgb 5s linear infinite;
    filter:blur(80px);
    opacity:.35;
    z-index:-1;
}

@keyframes rgb{
    to{transform:rotate(360deg)}
}

.container{
    width:94%;
    max-width:520px;
    padding:25px;
    border:2px solid transparent;
    border-radius:25px;
    background:
        linear-gradient(#090909,#090909) padding-box,
        linear-gradient(90deg,#ff0000,#00ffff,#ff00ff,#00ff00,#ff0000) border-box;
    box-shadow:0 0 35px #00ffff55;
}

.logo{
    text-align:center;
    font-size:30px;
    font-weight:bold;
    margin-bottom:5px;
}

.subtitle{
    text-align:center;
    color:#aaa;
    margin-bottom:25px;
}

input,select{
    width:100%;
    padding:15px;
    margin:8px 0;
    border-radius:12px;
    border:1px solid #444;
    outline:none;
    background:#111;
    color:white;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    margin-top:10px;
    border:0;
    border-radius:12px;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    background:linear-gradient(90deg,#ff0055,#7b00ff,#00d9ff);
}

button:disabled{
    opacity:.6;
}

.status{
    text-align:center;
    margin:18px 0;
    color:#00ffff;
}

.card{
    margin-top:18px;
    padding:20px;
    border-radius:18px;
    background:#111;
    border:1px solid #333;
    display:none;
}

.name{
    text-align:center;
    font-size:25px;
    font-weight:bold;
    margin-bottom:18px;
}

.info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.item{
    padding:13px;
    border-radius:12px;
    background:#181818;
    border:1px solid #292929;
}

.label{
    color:#888;
    font-size:12px;
}

.value{
    margin-top:5px;
    font-size:17px;
    font-weight:bold;
}

.error{
    color:#ff5555;
    text-align:center;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:#777;
    font-size:12px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">🔥 OHID AI</div>
    <div class="subtitle">Free Fire UID Checker</div>

    <input
        id="uid"
        type="number"
        placeholder="Enter Free Fire UID"
    >

    <select id="server">
        <option value="BD">🇧🇩 Bangladesh</option>
        <option value="IND">🇮🇳 India</option>
        <option value="SG">🇸🇬 Singapore</option>
        <option value="PK">🇵🇰 Pakistan</option>
        <option value="ID">🇮🇩 Indonesia</option>
        <option value="ME">🌍 Middle East</option>
        <option value="BR">🇧🇷 Brazil</option>
        <option value="US">🇺🇸 North America</option>
    </select>

    <button id="searchBtn" onclick="getPlayer()">
        🔍 Search Player
    </button>

    <div id="status" class="status"></div>

    <div id="card" class="card">

        <div id="nickname" class="name">Player</div>

        <div class="info">

            <div class="item">
                <div class="label">UID</div>
                <div id="uidValue" class="value">-</div>
            </div>

            <div class="item">
                <div class="label">Level</div>
                <div id="level" class="value">-</div>
            </div>

            <div class="item">
                <div class="label">Region</div>
                <div id="region" class="value">-</div>
            </div>

            <div class="item">
                <div class="label">Likes</div>
                <div id="likes" class="value">-</div>
            </div>

            <div class="item">
                <div class="label">BR Rank</div>
                <div id="rank" class="value">-</div>
            </div>

            <div class="item">
                <div class="label">CS Rank</div>
                <div id="csrank" class="value">-</div>
            </div>

            <div class="item">
                <div class="label">Ranking Points</div>
                <div id="points" class="value">-</div>
            </div>

            <div class="item">
                <div class="label">Max Rank</div>
                <div id="maxrank" class="value">-</div>
            </div>

        </div>
    </div>

    <div class="footer">
        Unofficial Free Fire Player Information Tool
    </div>

</div>

<script>

async function getPlayer(){

    const uid = document.getElementById("uid").value.trim();
    const server = document.getElementById("server").value;

    const status = document.getElementById("status");
    const card = document.getElementById("card");
    const button = document.getElementById("searchBtn");

    if(!uid){
        status.innerHTML =
            '<span class="error">⚠️ Please enter a UID</span>';
        card.style.display = "none";
        return;
    }

    if(!/^[0-9]+$/.test(uid)){
        status.innerHTML =
            '<span class="error">⚠️ UID must contain numbers only</span>';
        return;
    }

    button.disabled = true;
    button.innerText = "⏳ Searching...";
    status.innerText = "Loading player information...";
    card.style.display = "none";

    try{

        const url =
        `https://freefireinfo-zy9l.onrender.com/api/v1/player-profile?uid=${encodeURIComponent(uid)}&server=${encodeURIComponent(server)}`;

        const response = await fetch(url);

        const data = await response.json();

        if(!response.ok){
            throw new Error(
                data.message || "Player not found"
            );
        }

        const info = data.basicinfo || {};

        document.getElementById("nickname").innerText =
            info.nickname || "Unknown Player";

        document.getElementById("uidValue").innerText =
            info.accountid || uid;

        document.getElementById("level").innerText =
            info.level ?? "-";

        document.getElementById("region").innerText =
            info.region || server;

        document.getElementById("likes").innerText =
            info.liked ?? "-";

        document.getElementById("rank").innerText =
            info.rank ?? "-";

        document.getElementById("csrank").innerText =
            info.csrank ?? "-";

        document.getElementById("points").innerText =
            info.rankingpoints ?? "-";

        document.getElementById("maxrank").innerText =
            info.maxrank ?? "-";

        status.innerHTML =
            '<span style="color:#00ff88">✅ Player Found</span>';

        card.style.display = "block";

    }catch(error){

        console.error(error);

        status.innerHTML =
            `<span class="error">❌ ${escapeHtml(error.message || "API Error")}</span>`;

        card.style.display = "none";

    }finally{

        button.disabled = false;
        button.innerText = "🔍 Search Player";

    }
}

function escapeHtml(text){

    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;

}

</script>

</body>
</html>

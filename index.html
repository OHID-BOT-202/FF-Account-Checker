<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ohid AI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#050505;
    color:white;
    font-family:Arial, sans-serif;
    overflow-x:hidden;
}

/* RGB Background */
body::before{
    content:"";
    position:fixed;
    inset:-50%;
    background:
      conic-gradient(
        #ff0000,
        #ff00ff,
        #0000ff,
        #00ffff,
        #00ff00,
        #ffff00,
        #ff0000
      );
    animation:rotate 8s linear infinite;
    filter:blur(100px);
    opacity:.18;
    z-index:-1;
}

@keyframes rotate{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

/* Header */
header{
    width:100%;
    padding:20px;
    text-align:center;
    border-bottom:1px solid rgba(255,255,255,.15);
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(15px);
}

.logo{
    font-size:28px;
    font-weight:bold;
    letter-spacing:3px;
    animation:rgbText 3s linear infinite;
}

@keyframes rgbText{
    0%{color:#ff0000;text-shadow:0 0 15px #ff0000;}
    33%{color:#00ffff;text-shadow:0 0 15px #00ffff;}
    66%{color:#ff00ff;text-shadow:0 0 15px #ff00ff;}
    100%{color:#ff0000;text-shadow:0 0 15px #ff0000;}
}

/* Main */
.container{
    width:92%;
    max-width:650px;
    margin:50px auto;
}

.card{
    padding:30px 20px;
    border-radius:25px;
    background:rgba(10,10,10,.75);
    border:1px solid rgba(255,255,255,.18);
    backdrop-filter:blur(18px);
    box-shadow:0 0 30px rgba(0,255,255,.12);
    text-align:center;
}

.card h1{
    font-size:34px;
    margin-bottom:10px;
}

.card p{
    color:#aaa;
    margin-bottom:25px;
}

/* Input */
input{
    width:100%;
    padding:16px;
    border-radius:12px;
    border:1px solid #333;
    outline:none;
    background:#111;
    color:white;
    font-size:16px;
    margin-bottom:15px;
}

input:focus{
    border-color:#00ffff;
    box-shadow:0 0 15px rgba(0,255,255,.3);
}

/* Button */
button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:12px;
    color:white;
    background:linear-gradient(
        90deg,
        #ff004c,
        #7b00ff,
        #00c8ff
    );
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 0 25px rgba(0,255,255,.4);
}

#result{
    margin-top:20px;
    padding:15px;
    border-radius:12px;
    background:#0d0d0d;
    border:1px solid #222;
    display:none;
}

/* Feature cards */
.features{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-top:20px;
}

.feature{
    padding:18px 8px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);
    border-radius:15px;
    text-align:center;
}

.feature span{
    display:block;
    font-size:25px;
    margin-bottom:7px;
}

.feature small{
    color:#aaa;
}

/* Mobile */
@media(max-width:500px){

    .container{
        margin:30px auto;
    }

    .card{
        padding:25px 16px;
    }

    .card h1{
        font-size:28px;
    }

    .features{
        grid-template-columns:1fr;
    }

    .feature{
        padding:15px;
    }

    .logo{
        font-size:23px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">⚡ OHID AI</div>
</header>

<div class="container">

    <div class="card">

        <h1>Welcome 👋</h1>

        <p>
            Mobile Friendly RGB Website
        </p>

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
        >

        <button onclick="showMessage()">
            🚀 Continue
        </button>

        <div id="result"></div>

    </div>

    <div class="features">

        <div class="feature">
            <span>📱</span>
            <small>Mobile Friendly</small>
        </div>

        <div class="feature">
            <span>🌈</span>
            <small>RGB Design</small>
        </div>

        <div class="feature">
            <span>⚡</span>
            <small>Fast UI</small>
        </div>

    </div>

</div>

<script>
function showMessage(){

    const name = document.getElementById("name").value.trim();
    const result = document.getElementById("result");

    if(name === ""){
        result.style.display = "block";
        result.innerHTML = "⚠️ Please enter your name.";
        return;
    }

    result.style.display = "block";
    result.innerHTML =
        "🔥 Welcome, <b>" +
        name +
        "</b>!<br><br>You're inside Ohid AI.";
}
</script>

</body>
</html>

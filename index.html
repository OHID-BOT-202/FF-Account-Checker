<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ohid AI - Free Fire UID Checker</title>

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Orbitron:wght@500;700;800&display=swap" rel="stylesheet">

<!-- Google reCAPTCHA -->
<script src="https://www.google.com/recaptcha/api.js" async defer></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  color:#fff;
  font-family:"Hind Siliguri",Arial,sans-serif;
  background:
    radial-gradient(circle at top left,#ff0055aa,transparent 35%),
    radial-gradient(circle at bottom right,#00eaff99,transparent 35%),
    #080b16;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(120deg,transparent 45%,#ff005522 50%,transparent 55%),
    linear-gradient(300deg,transparent 45%,#00eaff22 50%,transparent 55%);
  animation:bgMove 7s linear infinite;
}

@keyframes bgMove{
  0%{transform:translateX(-20%)}
  100%{transform:translateX(20%)}
}

.container{
  position:relative;
  width:100%;
  max-width:520px;
  padding:28px;
  border:1px solid #ffffff25;
  border-radius:24px;
  background:#101522dd;
  backdrop-filter:blur(18px);
  box-shadow:
    0 0 20px #ff005533,
    0 0 45px #00eaff22;
}

.logo{
  text-align:center;
  margin-bottom:8px;
  font-family:Orbitron,Arial,sans-serif;
  font-size:28px;
  font-weight:800;
  letter-spacing:2px;
  animation:rgbText 4s linear infinite;
}

@keyframes rgbText{
  0%{color:#ff0055;text-shadow:0 0 15px #ff0055}
  33%{color:#00eaff;text-shadow:0 0 15px #00eaff}
  66%{color:#7dff00;text-shadow:0 0 15px #7dff00}
  100%{color:#ff0055;text-shadow:0 0 15px #ff0055}
}

.subtitle{
  text-align:center;
  color:#aeb8cc;
  margin-bottom:25px;
  font-size:15px;
}

label{
  display:block;
  margin:14px 0 7px;
  color:#dce5f7;
  font-size:15px;
  font-weight:600;
}

input,select{
  width:100%;
  padding:14px 16px;
  border:1px solid #ffffff25;
  border-radius:12px;
  outline:none;
  background:#080c18cc;
  color:#fff;
  font-size:16px;
  transition:.3s;
}

input:focus,select:focus{
  border-color:#00eaff;
  box-shadow:0 0 12px #00eaff55;
}

select option{
  color:#000;
}

.captcha-box{
  display:flex;
  justify-content:center;
  margin:22px 0 15px;
  overflow:hidden;
}

button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:13px;
  cursor:pointer;
  color:#fff;
  font-size:17px;
  font-weight:700;
  font-family:"Hind Siliguri",Arial,sans-serif;
  background:linear-gradient(90deg,#ff0055,#7b2cff,#00c8ff);
  background-size:200% 200%;
  animation:buttonRGB 4s ease infinite;
  box-shadow:0 0 18px #7b2cff66;
  transition:.3s;
}

button:hover{
  transform:translateY(-2px);
  box-shadow:0 0 25px #00eaff88;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
  transform:none;
}

@keyframes buttonRGB{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.status{
  display:none;
  margin-top:18px;
  padding:14px;
  border-radius:12px;
  text-align:center;
  font-size:15px;
  white-space:pre-wrap;
}

.status.info{
  display:block;
  background:#008cff22;
  border:1px solid #00bfff66;
  color:#9deaff;
}

.status.error{
  display:block;
  background:#ff174422;
  border:1px solid #ff174466;
  color:#ff9aaa;
}

.status.success{
  display:block;
  background:#00ff8822;
  border:1px solid #00ff8866;
  color:#9affc8;
}

.result{
  display:none;
  margin-top:20px;
  padding:18px;
  border-radius:15px;
  background:#050812aa;
  border:1px solid #00eaff55;
  box-shadow:0 0 18px #00eaff22;
}

.result h3{
  margin:0 0 14px;
  color:#00eaff;
  text-align:center;
}

.result-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:10px 0;
  border-bottom:1px solid #ffffff12;
}

.result-row:last-child{
  border-bottom:0;
}

.result-row span:first-child{
  color:#aeb8cc;
}

.result-row span:last-child{
  color:#fff;
  font-weight:600;
  text-align:right;
  word-break:break-word;
}

.footer{
  margin-top:20px;
  text-align:center;
  color:#77839a;
  font-size:13px;
}

@media(max-width:430px){
  .container{
    padding:21px;
    border-radius:18px;
  }

  .logo{
    font-size:23px;
  }

  .result-row{
    flex-direction:column;
    gap:3px;
  }

  .result-row span:last-child{
    text-align:left;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">OHID AI</div>
  <div class="subtitle">Free Fire UID Information Checker</div>

  <label for="uid">Free Fire UID</label>
  <input
    type="number"
    id="uid"
    placeholder="তোমার Free Fire UID লিখুন"
    autocomplete="off"
  >

  <label for="region">Region</label>
  <select id="region">
    <option value="bd">Bangladesh</option>
    <option value="ind">India</option>
    <option value="pk">Pakistan</option>
    <option value="sg">Singapore</option>
    <option value="me">Middle East</option>
    <option value="br">Brazil</option>
    <option value="us">USA</option>
  </select>

  <div class="captcha-box">
    <!-- এখানে YOUR_GOOGLE_SITE_KEY পরিবর্তন করো -->
    <div
      class="g-recaptcha"
      data-sitekey="YOUR_GOOGLE_SITE_KEY"
      data-theme="dark">
    </div>
  </div>

  <button id="checkBtn" onclick="checkUID()">
    UID Check করুন
  </button>

  <div id="status" class="status"></div>

  <div id="result" class="result">
    <h3>Player Information</h3>
    <div id="resultContent"></div>
  </div>

  <div class="footer">
    Powered by Ohid AI
  </div>

</div>

<script>
const API_URL =
  "https://freefireinfo.nepcoderapis.workers.dev/";

function showStatus(message, type){
  const status = document.getElementById("status");
  status.className = "status " + type;
  status.textContent = message;
}

function escapeHTML(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function formatKey(key){
  return String(key)
    .replaceAll("_"," ")
    .replace(/\b\w/g, char => char.toUpperCase());
}

function createResultHTML(data){
  let html = "";

  function addRows(obj){
    Object.entries(obj).forEach(([key,value]) => {
      if(
        value !== null &&
        value !== undefined &&
        typeof value !== "object"
      ){
        html += `
          <div class="result-row">
            <span>${escapeHTML(formatKey(key))}</span>
            <span>${escapeHTML(value)}</span>
          </div>
        `;
      }
    });
  }

  if(data && typeof data === "object"){
    if(data.data && typeof data.data === "object"){
      addRows(data.data);
    }else{
      addRows(data);
    }
  }

  if(!html){
    html = `
      <div class="result-row">
        <span>Response</span>
        <span>${escapeHTML(JSON.stringify(data))}</span>
      </div>
    `;
  }

  return html;
}

async function checkUID(){
  const uid = document.getElementById("uid").value.trim();
  const region = document.getElementById("region").value;
  const button = document.getElementById("checkBtn");
  const result = document.getElementById("result");

  if(!uid){
    showStatus("প্রথমে UID লিখুন।","error");
    return;
  }

  if(uid.length < 5){
    showStatus("সঠিক Free Fire UID লিখুন।","error");
    return;
  }

  // Google reCAPTCHA response সংগ্রহ
  const captchaResponse =
    typeof grecaptcha !== "undefined"
      ? grecaptcha.getResponse()
      : "";

  if(!captchaResponse){
    showStatus("আগে CAPTCHA সম্পূর্ণ করুন।","error");
    return;
  }

  button.disabled = true;
  button.textContent = "তথ্য খোঁজা হচ্ছে...";
  result.style.display = "none";

  showStatus("API থেকে তথ্য আনা হচ্ছে...","info");

  try{
    const url =
      API_URL +
      "?uid=" + encodeURIComponent(uid) +
      "&region=" + encodeURIComponent(region);

    const response = await fetch(url);

    const text = await response.text();

    let data;

    try{
      data = JSON.parse(text);
    }catch{
      throw new Error(
        "API সঠিক JSON response দেয়নি। API হয়তো CAPTCHA বা rate limit দেখাচ্ছে।"
      );
    }

    if(!response.ok){
      throw new Error(
        data.message ||
        data.error ||
        "API request ব্যর্থ হয়েছে।"
      );
    }

    document.getElementById("resultContent").innerHTML =
      createResultHTML(data);

    result.style.display = "block";
    showStatus("Player information পাওয়া গেছে।","success");

  }catch(error){
    showStatus(
      "সমস্যা হয়েছে:\n" + error.message,
      "error"
    );
  }finally{
    button.disabled = false;
    button.textContent = "UID Check করুন";

    if(typeof grecaptcha !== "undefined"){
      grecaptcha.reset();
    }
  }
}
</script>

</body>
</html>

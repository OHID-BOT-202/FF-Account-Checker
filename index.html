<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ohid AI - Free Fire UID Checker</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    padding:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
    color:#fff;
    background:#050505;
    overflow-x:hidden;
}

body:before{
    content:"";
    position:fixed;
    inset:-30%;
    z-index:-1;
    background:conic-gradient(
        #ff0000,
        #ff00ff,
        #0000ff,
        #00ffff,
        #00ff00,
        #ffff00,
        #ff0000
    );
    filter:blur(100px);
    opacity:.25;
    animation:rotate 6s linear infinite;
}

@keyframes rotate{
    to{transform:rotate(360deg)}
}

.box{
    width:100%;
    max-width:540px;
    padding:25px;
    border-radius:25px;
    background:#080808ee;
    position:relative;
}

.box:before{
    content:"";
    position:absolute;
    inset:-2px;
    z-index:-1;
    border-radius:27px;
    background:linear-gradient(
        90deg,
        #ff0000,
        #ff00ff,
        #00ffff,
        #00ff00,
        #ffff00,
        #ff0000
    );
    background-size:400%;
    animation:border 4s linear infinite;
}

@keyframes border{
    to{background-position:400%}
}

.logo{
    text-align:center;
    font-size:30px;
    font-weight:900;
}

.subtitle{
    text-align:center;
    color:#999;
    margin:7px 0 25px;
}

input,select{
    width:100%;
    padding:15px;
    margin-bottom:12px;
    border-radius:12px;
    border:1px solid #333;
    outline:none;
    background:#111;
    color:#fff;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:12px;
    background:linear-gradient(
        90deg,
        #ff0055,
        #7b00ff,
        #00c8ff
    );
    color:#fff;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
}

#status{
    text-align:center;
    min-height:25px;
    margin:18px 0 5px;
}

.success{color:#00ff88}
.error{color:#ff5555}

.card{
    display:none;
    margin-top:18px;
    padding:18px;
    border-radius:18px;
    background:#101010;
    border:1px solid #333;
}

.nickname{
    text-align:center;
    font-size:25px;
    font-weight:bold;
    margin-bottom:18px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.item{
    padding:13px;
    border-radius:12px;
    background:#181818;
    border:1px solid #292929;
}

.label{
    color:#888;
    font-size:12px;
}

.value{
    margin-top:5px;
    font-size:17px;
    font-weight:bold;
    word-break:break-word;
}

.raw{
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    background:#050505;
    color:#aaa;
    font-size:11px;
    max-height:180px;
    overflow:auto;
    white-space:pre-wrap;
}

.footer{
    margin-top:20px;
    text-align:center;
    color:#666;
    font-size:11px;
}
</style>
</head>

<body>

<div class="box">

    <div class="logo">🔥 OHID AI</div>

    <div class="subtitle">
        Free Fire Player Information
    </div>

    <input
        id="uid"
        type="text"
        inputmode="numeric"
        placeholder="Enter Free Fire UID"
    >

    <select id="server">
        <option value="BD">🇧🇩 Bangladesh</option>
        <option value="IND">🇮🇳 India</option>
        <option value="SG">🇸🇬 Singapore</option>
        <option value="PK">🇵🇰 Pakistan</option>
        <option value="ID">🇮🇩 Indonesia</option>
        <option value="ME">🌍 Middle East</option>
        <option value="BR">🇧🇷 Brazil</option>
        <option value="US">🇺🇸 North America</option>
    </select>

    <button id="searchBtn" onclick="searchPlayer()">
        🔍 Search Player
    </button>

    <div id="status"></div>

    <div id="card" class="card">

        <div id="nickname" class="nickname">
            Unknown Player
        </div>

        <div class="grid">

            <div class="item">
                <div class="label">UID</div>
                <div id="uidValue" class="value">-</div>
            </div>

            <div class="item">
                <div class="label">Level</div>
                <div id="level" class="value">-</div>
            </div>

            <div class="item">
                <div class="label">Region</div>
                <div id="region" class="value">-</div>
            </div>

            <div class="item">
                <div class="label">Likes</div>
                <div id="likes" class="value">-</div>
            </div>

            <div class="item">
                <div class="label">BR Rank</div>
                <div id="rank" class="value">-</div>
            </div>

            <div class="item">
                <div class="label">CS Rank</div>
                <div id="csrank" class="value">-</div>
            </div>

            <div class="item">
                <div class="label">Ranking Points</div>
                <div id="points" class="value">-</div>
            </div>

            <div class="item">
                <div class="label">Max Rank</div>
                <div id="maxrank" class="value">-</div>
            </div>

        </div>

        <pre id="raw" class="raw"></pre>

    </div>

    <div class="footer">
        Unofficial Free Fire Player Information Tool
    </div>

</div>

<script>

const API =
"https://freefireinfo-zy9l.onrender.com/api/v1/player-profile";

async function searchPlayer(){

    const uid =
        document.getElementById("uid")
        .value.trim();

    const server =
        document.getElementById("server")
        .value;

    const status =
        document.getElementById("status");

    const card =
        document.getElementById("card");

    const button =
        document.getElementById("searchBtn");

    card.style.display="none";

    if(!uid){

        status.innerHTML =
        '<span class="error">⚠️ UID দিন</span>';

        return;
    }

    if(!/^[0-9]+$/.test(uid)){

        status.innerHTML =
        '<span class="error">⚠️ UID শুধু সংখ্যা হতে হবে</span>';

        return;
    }

    button.disabled=true;
    button.innerText="⏳ Searching...";
    status.innerText="Player information loading...";

    try{

        /*
         * GitHub Pages থেকে সরাসরি API request.
         * API CORS allow না করলে browser request block করবে।
         */

        const url =
            API +
            "?uid=" +
            encodeURIComponent(uid) +
            "&server=" +
            encodeURIComponent(server);

        const response =
            await fetch(url,{
                method:"GET",
                headers:{
                    "Accept":"application/json"
                }
            });

        if(!response.ok){

            throw new Error(
                "API HTTP Error: " +
                response.status
            );
        }

        const data =
            await response.json();

        const info =
            data.basicinfo ||
            data.basicInfo ||
            data.player ||
            data.data ||
            data;

        document.getElementById("nickname").textContent =
            info.nickname ||
            info.name ||
            "Unknown Player";

        document.getElementById("uidValue").textContent =
            info.accountid ||
            info.accountId ||
            uid;

        document.getElementById("level").textContent =
            info.level ?? "-";

        document.getElementById("region").textContent =
            info.region ||
            server;

        document.getElementById("likes").textContent =
            info.liked ??
            info.likes ??
            "-";

        document.getElementById("rank").textContent =
            info.rank ??
            info.brRank ??
            "-";

        document.getElementById("csrank").textContent =
            info.csrank ??
            info.csRank ??
            "-";

        document.getElementById("points").textContent =
            info.rankingpoints ??
            info.rankingPoints ??
            "-";

        document.getElementById("maxrank").textContent =
            info.maxrank ??
            info.maxRank ??
            "-";

        document.getElementById("raw").textContent =
            JSON.stringify(data,null,2);

        card.style.display="block";

        status.innerHTML =
        '<span class="success">✅ Player Found</span>';

    }catch(error){

        console.error(error);

        let message = error.message;

        if(
            error instanceof TypeError &&
            message.toLowerCase().includes("fetch")
        ){

            message =
            "CORS/API connection blocked. এই API browser থেকে access করতে দিচ্ছে না।";
        }

        status.innerHTML =
        '<span class="error">❌ ' +
        escapeHTML(message) +
        '</span>';

    }finally{

        button.disabled=false;
        button.innerText="🔍 Search Player";

    }
}

function escapeHTML(text){

    const div=document.createElement("div");

    div.textContent=text;

    return div.innerHTML;
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ohid AI - Free Fire UID Checker</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:#050505;
    overflow-x:hidden;
}

body:before{
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    inset:0;
    background:
      radial-gradient(circle at 20% 20%,#ff005555,transparent 35%),
      radial-gradient(circle at 80% 30%,#00ffff55,transparent 35%),
      radial-gradient(circle at 50% 90%,#8a00ff55,transparent 35%);
    filter:blur(25px);
    animation:bg 5s linear infinite alternate;
    z-index:-1;
}

@keyframes bg{
    from{transform:scale(1)}
    to{transform:scale(1.15)}
}

.box{
    width:100%;
    max-width:520px;
    padding:25px;
    border-radius:25px;
    background:#080808ee;
    border:2px solid transparent;
    background-clip:padding-box;
    position:relative;
    box-shadow:0 0 35px #00ffff33;
}

.box:before{
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:27px;
    background:linear-gradient(
      90deg,
      #ff0000,
      #ff00ff,
      #0000ff,
      #00ffff,
      #00ff00,
      #ffff00,
      #ff0000
    );
    z-index:-1;
    background-size:400%;
    animation:borderRGB 4s linear infinite;
}

@keyframes borderRGB{
    0%{background-position:0%}
    100%{background-position:400%}
}

.logo{
    text-align:center;
    font-size:30px;
    font-weight:900;
    margin-bottom:5px;
}

.sub{
    text-align:center;
    color:#999;
    margin-bottom:25px;
}

input,select{
    width:100%;
    padding:15px;
    margin-bottom:12px;
    border-radius:12px;
    border:1px solid #333;
    outline:none;
    background:#111;
    color:#fff;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:12px;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    background:linear-gradient(
      90deg,
      #ff0055,
      #7b00ff,
      #00c8ff
    );
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

#status{
    text-align:center;
    min-height:25px;
    margin:18px 0 5px;
}

.card{
    display:none;
    margin-top:18px;
    padding:18px;
    border-radius:18px;
    background:#101010;
    border:1px solid #333;
}

.nickname{
    text-align:center;
    font-size:25px;
    font-weight:bold;
    margin-bottom:18px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.item{
    padding:13px;
    border-radius:12px;
    background:#181818;
    border:1px solid #292929;
}

.label{
    font-size:12px;
    color:#888;
}

.value{
    margin-top:5px;
    font-size:17px;
    font-weight:bold;
    word-break:break-word;
}

.error{
    color:#ff5555;
}

.success{
    color:#00ff88;
}

.footer{
    text-align:center;
    color:#666;
    font-size:11px;
    margin-top:20px;
}
</style>
</head>

<body>

<div class="box">

    <div class="logo">🔥 OHID AI</div>

    <div class="sub">
        Free Fire Player Info
    </div>

    <input
        id="uid"
        type="text"
        inputmode="numeric"
        placeholder="Enter Free Fire UID"
    >

    <select id="server">
        <option value="BD">🇧🇩 Bangladesh</option>
        <option value="IND">🇮🇳 India</option>
        <option value="SG">🇸🇬 Singapore</option>
        <option value="PK">🇵🇰 Pakistan</option>
        <option value="ID">🇮🇩 Indonesia</option>
        <option value="ME">🌍 Middle East</option>
        <option value="BR">🇧🇷 Brazil</option>
        <option value="US">🇺🇸 North America</option>
    </select>

    <button id="searchBtn" onclick="searchPlayer()">
        🔍 Search Player
    </button>

    <div id="status"></div>

    <div id="card" class="card">

        <div id="nickname" class="nickname">
            Unknown Player
        </div>

        <div class="grid">

            <div class="item">
                <div class="label">UID</div>
                <div id="uidValue" class="value">-</div>
            </div>

            <div class="item">
                <div class="label">Level</div>
                <div id="level" class="value">-</div>
            </div>

            <div class="item">
                <div class="label">Region</div>
                <div id="region" class="value">-</div>
            </div>

            <div class="item">
                <div class="label">Likes</div>
                <div id="likes" class="value">-</div>
            </div>

            <div class="item">
                <div class="label">BR Rank</div>
                <div id="rank" class="value">-</div>
            </div>

            <div class="item">
                <div class="label">CS Rank</div>
                <div id="csrank" class="value">-</div>
            </div>

            <div class="item">
                <div class="label">Ranking Points</div>
                <div id="points" class="value">-</div>
            </div>

            <div class="item">
                <div class="label">Max Rank</div>
                <div id="maxrank" class="value">-</div>
            </div>

        </div>
    </div>

    <div class="footer">
        Unofficial Free Fire Player Information Tool
    </div>

</div>

<script>

async function searchPlayer(){

    const uid = document
        .getElementById("uid")
        .value
        .trim();

    const server = document
        .getElementById("server")
        .value;

    const status =
        document.getElementById("status");

    const card =
        document.getElementById("card");

    const button =
        document.getElementById("searchBtn");

    card.style.display = "none";

    if(!uid){

        status.innerHTML =
            '<span class="error">⚠️ Enter a UID</span>';

        return;
    }

    if(!/^[0-9]+$/.test(uid)){

        status.innerHTML =
            '<span class="error">⚠️ UID must contain numbers only</span>';

        return;
    }

    button.disabled = true;
    button.innerText = "⏳ Searching...";
    status.innerText = "Loading player information...";

    try{

        const response = await fetch(
            "api.php?uid=" +
            encodeURIComponent(uid) +
            "&server=" +
            encodeURIComponent(server)
        );

        const data = await response.json();

        if(!response.ok || data.error){

            throw new Error(
                data.error || "Player not found"
            );
        }

        const info =
            data.basicinfo ||
            data.basicInfo ||
            data.player ||
            data;

        document.getElementById("nickname").textContent =
            info.nickname ||
            info.name ||
            "Unknown Player";

        document.getElementById("uidValue").textContent =
            info.accountid ||
            info.accountId ||
            uid;

        document.getElementById("level").textContent =
            info.level ?? "-";

        document.getElementById("region").textContent =
            info.region ||
            server;

        document.getElementById("likes").textContent =
            info.liked ??
            info.likes ??
            "-";

        document.getElementById("rank").textContent =
            info.rank ??
            info.brRank ??
            "-";

        document.getElementById("csrank").textContent =
            info.csrank ??
            info.csRank ??
            "-";

        document.getElementById("points").textContent =
            info.rankingpoints ??
            info.rankingPoints ??
            "-";

        document.getElementById("maxrank").textContent =
            info.maxrank ??
            info.maxRank ??
            "-";

        card.style.display = "block";

        status.innerHTML =
            '<span class="success">✅ Player Found</span>';

    }catch(error){

        console.error(error);

        status.innerHTML =
            '<span class="error">❌ ' +
            escapeHTML(error.message) +
            '</span>';

    }finally{

        button.disabled = false;
        button.innerText = "🔍 Search Player";

    }
}

function escapeHTML(text){

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}

</script>

</body>
</html>
